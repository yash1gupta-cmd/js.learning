<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chai and code | DOM</title>
</head>

<body style="background-color: #212121; color: white;">
    <ul class="language">
        <li>java script</li>
    </ul>
    </body>
    <script>
        function addLanguage(langName) {
            const li = document.createElement('li')
            li.innerHTML = `${langName}`
            document.querySelector('.language').appendChild(li)
        }
        addLanguage("python")
        addLanguage("typeScript")

        // both work in same way but  the lower one is optimized 
        function addOptiLanguage(langName) {
            const li = document.createElement('li')
            li.appendChild(document.createTextNode(langName))
            document.querySelector('.language').appendChild(li)
        }
        addOptiLanguage("red")

        // EDIT 
        const secLang  = document.querySelector("li:nth-child(2)")
        // if any confuion in nth child than use console log () 
        console.log(secLang);
        
        // secLang.innerHTML = "mojo"
        const newLi = document.createElement("li")
        newLi.textContent = "red"
        secLang.replaceWith(newLi)
        
        // EDIT 
        const firstLang = document.querySelector("li:first-child")
        firstLang.outerHTML = "<li>TypeScript</li>"

        // remove 
        const lastLang = document.querySelector("li:last-child")
        lastLang.remove()

    </script>
</html>
